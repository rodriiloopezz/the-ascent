name: Update Madam CEO

on:
  schedule:
    # Three times a day (times are UTC: 06:17, 12:17, 18:17 → about 7:17, 13:17, 19:17 in Madrid in winter)
    - cron: "17 6,12,18 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab
  push:                   # when you upload changes, rebuild the site (no new news, no cost)
    branches: [main]

permissions:
  contents: write   # to save data/articles.json back to the repo
  pages: write      # to publish the website
  id-token: write   # required by GitHub Pages deployment

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser for social images
        if: github.event_name != 'push'
        run: python -m playwright install --with-deps chromium

      - name: Fetch news, write articles and build the site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          COMMUNITY_URL: ${{ secrets.COMMUNITY_URL }}
          COMMUNITY_KEY: ${{ secrets.COMMUNITY_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python ascent_news.py --build-only
          else
            python ascent_news.py
          fi

      - name: Save the article archive
        run: |
          git config user.name "the-ascent-bot"
          git config user.email "the-ascent-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "New articles $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  post:
    # Publishes pending social kits once the images are online
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Wait for the website to update
        run: sleep 60

      - name: Post to Instagram and X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_social.py

      - name: Save what was posted
        run: |
          git config user.name "the-ascent-bot"
          git config user.email "the-ascent-bot@users.noreply.github.com"
          git add data/social/queue.json
          git diff --cached --quiet || git commit -m "Social posts $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase && git push

      - name: Keep the Instagram token fresh
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -f ig_token_refreshed.txt ] && [ -n "$GH_TOKEN" ]; then
            gh secret set IG_ACCESS_TOKEN < ig_token_refreshed.txt
            echo "Instagram token saved"
          fi
          rm -f ig_token_refreshed.txt
